# Continuous integration for the Real-Time Scheduling Platform monorepo.
#
# Integration tests use GitHub Actions service containers (postgres:16-alpine,
# redis:7-alpine) with the same credentials as docker/docker-compose.yml
# `full` profile — equivalent to Testcontainers-backed Postgres/Redis without
# rewriting the node:test suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@repo/database
      - run: npm run build --workspace=@repo/database
      - run: npm run build --workspace=@repo/shared
      - run: npm run typecheck

  test-unit:
    name: test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@repo/database
      - run: npm run build --workspace=@repo/database
      - run: npm run build --workspace=@repo/shared
      - run: npm run test

  test-integration:
    name: test (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduling_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduling_platform
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      API_URL: http://localhost:3333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@repo/database
      - run: npm run build --workspace=@repo/database
      - run: npm run build --workspace=@repo/shared
      - run: npm run db:migrate:deploy --workspace=@repo/database
      - run: npm run test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scheduling_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@repo/database
      - run: npm run build --workspace=@repo/database
      - run: npm run build --workspace=@repo/shared
      - run: npm run build
